name: LRE Sync - External Repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-sync:
    name: Sync external repository scripts with LRE
    runs-on: ubuntu-latest
    environment: LRE

    env:
      lre_username: ${{ secrets.LRE_USERNAME }}
      lre_password: ${{ secrets.LRE_PASSWORD }}

      # Change only this line to select the folder to synchronize.
      SYNC_PATH: ${{ github.workspace }}/LR_Scripts/Scripts/SAP

    steps:
      - name: Checkout external repository
        uses: actions/checkout@v6
        with:
          repository: salvadorcamachogithub/LR_Scripts
          ref: master
          path: LR_Scripts

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - name: Verify script workspace
        run: |
          echo "Workspace directory:"
          echo "${{ env.SYNC_PATH }}"
          echo "Files found:"
          find "${{ env.SYNC_PATH }}" -type f

      - name: Synchronize external repository scripts with LRE
        uses: MicroFocus/lre-gh-action@v1.0.7
        with:
          lre_action: WorkspaceSync
          lre_description: Synchronize scripts from external GitHub repository

          lre_server: lreorgdemo.saas.microfocus.com/?tenant=63acd16e-6797-431a-b734-788ab1ef1db9
          lre_https_protocol: true
          lre_authenticate_with_token: false

          lre_domain: Salvador
          lre_project: AOS

          lre_workspace_dir: ${{ env.SYNC_PATH }}

          lre_runtime_only: true
          lre_workspace_sync_success_threshold: 100
          lre_workspace_sync_delete_removed_scripts: false
          lre_enable_stacktrace: true

      - name: Display WorkspaceSync logs
        if: always()
        run: |
          echo "WorkspaceSync logs:"
          find "${{ env.SYNC_PATH }}/logs" -type f || true

      - name: Upload WorkspaceSync logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LRE-External-Repository-Sync-Logs-${{ github.run_number }}
          path: ${{ env.SYNC_PATH }}/logs
          if-no-files-found: warn